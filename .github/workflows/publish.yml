# Redraw every chart and publish it.
#
# **Asked hourly to be served three-hourly.** What the providers do would suggest every three hours:
# ICON-EU runs eight times a day, ECMWF IFS four, MET re-serves hourly on four model runs. But
# GitHub treats `schedule` on a public repository as a suggestion — measured over 2026-08-31, three
# of eight slots fired at all, each 100 to 145 minutes late. Asking every hour is what makes the
# delivered cadence land near the intended one, and it costs nothing: public repositories consume no
# Actions minutes, three places spend about 290 of Open-Meteo's 10,000 daily calls, and MET's own
# terms are met exactly, since its locationforecast updates about hourly.
#
# So this is not a claim that the weather changes hourly. It is a scheduler that drops most of what
# it is given. If GitHub ever became reliable, or the job moved to a cron that runs, this should go
# back to `35 */3 * * *`.
#
# :35 past leaves Open-Meteo time to have ingested a model run.
#
# **GitHub disables a scheduled workflow in a public repository after 60 days without repository
# activity**, and workflow runs do not count as activity. If the site stops updating and nothing
# else is wrong, look here first: GitHub will have emailed, and one button re-enables it. The job
# is deliberately a plain `bun` command with everything in the environment, so moving the schedule
# somewhere with a real cron is a re-host rather than a rewrite.
name: publish

on:
  schedule:
    - cron: "35 * * * *"
  # Editing the places, the renderer pin or the code republishes at once — that is the editing loop.
  push:
    branches: [main]
    paths:
      - places.json
      - renderer.json
      - scripts/**
      - .github/workflows/publish.yml
  workflow_dispatch:

# One publish at a time. Two runs would interleave their uploads and their prunes, and the prune of
# the older one would delete objects the newer one had just written.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # The chart renderer, at the commit renderer.json names. A partial, sparse clone of a public
      # repository: no credential, and about twelve megabytes.
      - name: Fetch the pinned renderer
        run: bun run renderer

      # The hostname is a variable rather than a secret: the site is public and its footer links
      # back to this repository, so the pairing is not something that could be kept.
      - name: Draw the charts
        run: bun run render
        env:
          WEATHER_CARDS_HOSTNAME: ${{ vars.WEATHER_CARDS_HOSTNAME }}

      # The endpoint carries the Cloudflare account id and the bucket names a bucket in it, so both
      # are secrets even though neither is a credential.
      - name: Publish
        run: bun run deploy
        env:
          WEATHER_CARDS_BUCKET: ${{ secrets.WEATHER_CARDS_BUCKET }}
          WEATHER_CARDS_S3_ENDPOINT: ${{ secrets.WEATHER_CARDS_S3_ENDPOINT }}
          WEATHER_CARDS_HOSTNAME: ${{ vars.WEATHER_CARDS_HOSTNAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.WEATHER_CARDS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WEATHER_CARDS_SECRET_ACCESS_KEY }}
