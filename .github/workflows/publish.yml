# Redraw every chart and publish it — on an edit, or on demand.
#
# **The hourly schedule has moved to the box.** It was `cron: "35 * * * *"` here, and it is gone for
# a measured reason rather than a felt one: GitHub treats `schedule` on a public repository as a
# suggestion, and over 2026-08-31 three of eight slots fired at all, each 100 to 145 minutes late.
# Asking hourly was compensation for exactly that. The second hazard was worse because it is silent
# — GitHub disables a scheduled workflow in a public repository after 60 days without repository
# activity, and workflow runs do not count as activity.
#
# It now runs as a systemd timer on `forge`, at the same :35 past, defined in
# `home/remote-dev/files/systemd/weather-cards-publish.timer`. That unit runs the same three bun
# commands this file does; only what decides *when* has changed. The minute is unchanged too — :35
# leaves Open-Meteo time to have ingested a model run.
#
# What is left here is the editing loop: a change to places.json, the renderer pin or the scripts
# publishes at once rather than waiting for the next hour. And workflow_dispatch, for a publish on
# demand from anywhere with a browser.

name: publish

on:
  # Editing the places, the renderer pin or the code republishes at once — that is the editing loop.
  push:
    branches: [main]
    paths:
      - places.json
      - renderer.json
      - scripts/**
      - .github/workflows/publish.yml
  workflow_dispatch:

# One publish at a time. Two runs would interleave their uploads and their prunes, and the prune of
# the older one would delete objects the newer one had just written.
#
# Note what this group does *not* reach: the timer on forge is a second publisher and nothing
# coordinates the two. The window is one minute wide — an edit landing exactly on :35 — and it only
# bites when the edit changes *which* places exist, because otherwise both runs write the same
# manifest and the prune finds nothing stale to remove.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # The chart renderer, at the commit renderer.json names. A partial, sparse clone of a public
      # repository: no credential, and about twelve megabytes.
      - name: Fetch the pinned renderer
        run: bun run renderer

      # The hostname is a variable rather than a secret: the site is public and its footer links
      # back to this repository, so the pairing is not something that could be kept.
      - name: Draw the charts
        run: bun run render
        env:
          WEATHER_CARDS_HOSTNAME: ${{ vars.WEATHER_CARDS_HOSTNAME }}

      # The endpoint carries the Cloudflare account id and the bucket names a bucket in it, so both
      # are secrets even though neither is a credential.
      - name: Publish
        run: bun run deploy
        env:
          WEATHER_CARDS_BUCKET: ${{ secrets.WEATHER_CARDS_BUCKET }}
          WEATHER_CARDS_S3_ENDPOINT: ${{ secrets.WEATHER_CARDS_S3_ENDPOINT }}
          WEATHER_CARDS_HOSTNAME: ${{ vars.WEATHER_CARDS_HOSTNAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.WEATHER_CARDS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WEATHER_CARDS_SECRET_ACCESS_KEY }}
